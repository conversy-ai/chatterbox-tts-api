apiVersion: v1
kind: Service
metadata:
  name: chatterbox-tts-api-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.servicePort }}
    targetPort: {{ .Values.port }}
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: chatterbox-tts-api
